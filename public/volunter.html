<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Volunteer Hub | RCELLFEST</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
<!-- Scanner Library & Bootstrap JS -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> <!-- 👈 TAMBAHKAN INI -->

    <style>
        :root {
            --bg-body: #121212; --bg-card: #1e1e1e;
            --text-main: #f8f9fa; --text-muted: #a1a1aa;
            --primary: #3b82f6; --success: #10b981; --warning: #f59e0b;
        }
        body { 
            background-color: var(--bg-body); color: var(--text-main); 
            font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 30px;
        }
        .header-nav {
            background-color: var(--bg-card); padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: sticky; top: 0; z-index: 100;
        }
        .stats-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.05));
            border: 1px dashed var(--success); border-radius: 15px;
            padding: 20px; text-align: center; margin-bottom: 20px;
        }
        .stats-number {
            font-size: 3rem; font-weight: 800; color: var(--success); line-height: 1; text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }
        .scanner-box {
            background-color: var(--bg-card); border-radius: 15px; padding: 15px;
            border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #reader {
            width: 100%; border-radius: 10px; overflow: hidden;
            border: 3px solid var(--primary);
        }
        #reader video { object-fit: cover; }
        .kiosk-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff; border: none; font-weight: 700; font-size: 1.1rem;
            padding: 12px; border-radius: 50px; display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4); transition: 0.2s;
        }
        .kiosk-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245, 158, 11, 0.6); color: white;}
        /* 👇 TARUH CSS TAMBAHAN DI SINI 👇 */
/* Perjelas warna teks label di atas dropdown */
        .form-label {
            color: #ffffff !important;
        }
        /* Styling dropdown agar opsi di dalamnya punya latar belakang gelap yang kontras */
        #selectEventGate option {
            background-color: #1e1e1e !important;
            color: #ffffff !important;
            padding: 12px !important;
        }
        /* Efek hover pada opsi dropdown custom */
        #customEventList .dropdown-item {
            color: #f8f9fa !important;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 4px;
            transition: 0.2s;
            cursor: pointer;
            white-space: normal; /* Biar teks panjang otomatis turun ke bawah (tidak terpotong) */
        }
        #customEventList .dropdown-item:hover {
            background-color: var(--primary) !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="header-nav">
        <div class="d-flex align-items-center gap-2">
            <img src="https://i.ibb.co/W4LQdgGQ/IMG-1283.png" alt="Logo" width="35" height="35" class="rounded-circle">
            <div>
                <h6 class="mb-0 fw-bold" id="volName">Loading...</h6>
                <span class="badge bg-primary rounded-pill" style="font-size: 0.65rem;">PANITIA GATE</span>
            </div>
        </div>
        <button class="btn btn-sm btn-outline-danger rounded-pill fw-bold" onclick="logout()">Keluar</button>
    </div>

    <div class="container mt-4">
        
        <!-- INTEGRASI KIOSK -->
        <a href="/kiosk" target="_blank" class="kiosk-btn text-decoration-none w-100 mb-3">
            <i class="bi bi-display"></i> Buka Layar Kiosk / Antrean
        </a>
<!-- 👇 TARUH KODINGAN DROPDOWN BARU DI SINI 👇 -->
<!-- 👇 CUSTOM DROPDOWN EVENT ELEGANT 👇 -->
        <div class="glass-card mb-3 p-3" style="background: var(--bg-card); border: 1px solid #333; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.3);">
            <label class="form-label text-white small fw-bold mb-2 d-flex align-items-center gap-1">
                <i class="bi bi-shield-fill-check text-primary"></i> PILIH GATE / EVENT TUJUAN:
            </label>
            
            <!-- Tombol Pemicu Dropdown Custom -->
                <div class="dropdown">
                <!-- Ubah onclick untuk memicu fungsi buka/tutup manual -->
                <button class="btn w-100 text-start d-flex justify-content-between align-items-center text-white fw-bold py-3 px-3" type="button" id="dropdownEventButton" onclick="toggleDropdown()" style="background-color: #121212; border: 2px solid #333; border-radius: 12px; font-size: 0.95rem;">
                    <span id="selectedEventText">-- Pilih Event yang Sedang Dijaga --</span>
                    <i class="bi bi-chevron-down text-muted"></i>
                </button>
                
                <!-- Tambahkan style display: none agar tertutup default -->
                <ul class="dropdown-menu w-100 p-2 shadow-lg" id="customEventList" style="background-color: #1a1a1a; border: 1px solid #333; border-radius: 12px; max-height: 250px; overflow-y: auto; z-index: 1050; display: none; position: absolute; top: 100%; left: 0;">
                    <li><span class="dropdown-item text-muted text-center py-2">Memuat daftar event...</span></li>
                </ul>
            </div>
            
            <!-- Hidden input untuk menyimpan ID event yang dipilih (agar logika validasi kamera tetap berjalan normal) -->
            <input type="hidden" id="selectEventGate" value="">

            <div class="form-text text-muted mt-2 small">
                <i class="bi bi-info-circle me-1 text-warning"></i> Pastikan memilih event yang benar sebelum membuka kamera scan.
            </div>
        </div>
        <!-- 👆 ----------------------------------- 👆 -->

        <!-- STATISTIK SCAN -->
        <div class="stats-card shadow-sm">
            <p class="text-success fw-bold mb-2"><i class="bi bi-check-circle-fill me-1"></i> TIKET BERHASIL DI-SCAN</p>
            <div class="stats-number" id="scanCounter">0</div>
            <p class="text-muted small mt-2 mb-0">Total pencapaian Anda hari ini</p>
        </div>

        <!-- AREA KAMERA -->
        <div class="scanner-box text-center">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0 text-start"><i class="bi bi-qr-code-scan text-primary me-2"></i> Area Scan Tiket</h6>
                <div class="spinner-grow spinner-grow-sm text-primary" role="status" id="scanIndicator" style="display: none;"></div>
            </div>
            
            <!-- TOMBOL Buka Kamera -->
            <div id="startScanWrapper" class="py-4">
                <i class="bi bi-camera-fill display-3 text-muted mb-3 d-block"></i>
                <p class="text-muted small mb-3">Pilih event di atas, lalu buka kamera untuk mulai.</p>
                <button class="btn btn-success fw-bold px-4 py-2 rounded-pill shadow" onclick="startScanner()">
                    <i class="bi bi-play-fill me-1"></i> Buka Kamera & Scan
                </button>
            </div>

            <!-- KOTAK KAMERA -->
            <div id="reader" style="display: none;"></div>
            
            <!-- Tombol Tutup Kamera -->
            <button class="btn btn-outline-danger w-100 fw-bold py-2 mt-3 rounded-pill shadow" id="btnCloseScanner" onclick="stopScanner()" style="display: none;">
                <i class="bi bi-stop-circle me-1"></i> Tutup Kamera
            </button>
        </div>
        
    </div>

    <script>
        // ==========================================
        // 🔒 AUTENTIKASI & SETUP AWAL
        // ==========================================
// ==========================================
        // 🔒 AUTENTIKASI & SINKRONISASI ROLE OTOMATIS
        // ==========================================
        let user = JSON.parse(localStorage.getItem('userData'));
        if (!user) {
            window.location.href = '/user-login';
        }

        // 🔄 Sinkronisasi data terbaru langsung dari Database (Biar gak perlu logout pas role diubah admin)
async function syncUserProfile() {
            try {
                const res = await fetch(`/api/user/profile/${user.id}`);
                if (res.ok) {
                    const latestData = await res.json(); // 👈 TAMBAHKAN 'await' DI SINI!
                    
                    // Update data lokal dengan role terbaru dari database
                    user.role = latestData.role || user.role;
                    user.fullName = latestData.fullName || user.fullName;
                    localStorage.setItem('userData', JSON.stringify(user));
                }
            } catch (e) {
                console.log("Gagal sinkronisasi profil, menggunakan data lokal.");
            }

            // Validasi Role setelah disinkronkan
            const userRole = (user.role || '').toUpperCase();
            const isAllowed = userRole.includes('PANITIA') || userRole.includes('ADMIN') || userRole.includes('SUPER');
            
            if (!isAllowed) {
                Swal.fire({icon: 'error', title: 'Akses Ditolak', text: 'Halaman ini khusus Panitia / Scanner!'})
                .then(() => { window.location.href = '/'; });
            }
        }

        document.getElementById('volName').innerText = user.fullName || user.username;

        // ==========================================
        // 📥 AMBIL LIST EVENT UNTUK DROPDOWN
        // ==========================================
async function loadEventsForGate() {
            const listEl = document.getElementById('customEventList');
            try {
                const res = await fetch('/api/events');
                const events = await res.json();
                
                const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' });

                const activeEvents = events.filter(ev => {
                    const category = (ev.category || '').toLowerCase();
                    if (category.includes('stream')) return false; 

                    // 1. Cek status event (Sembunyikan jika sudah selesai/completed/closed)
                    const status = (ev.status || '').toLowerCase();
                    if (status === 'completed' || status === 'selesai' || status === 'closed') {
                        return false; 
                    }

                    // 2. Cek tanggal event (Sembunyikan jika tanggalnya sudah lewat)
                    if (ev.date) {
                        const eventDateStr = new Date(ev.date).toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' });
                        if (eventDateStr < todayStr) return false;
                    }

                    return true;
                });

                if (activeEvents.length === 0) {
                    listEl.innerHTML = '<li><span class="dropdown-item text-muted text-center py-2">Tidak ada event fisik aktif</span></li>';
                    return;
                }

                let html = '';
                activeEvents.forEach(ev => {
                    let tglFormat = ev.date ? new Date(ev.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : 'TBA';
                    let eventNameDisplay = `${ev.name} (${tglFormat} - ${ev.location || 'TBA'})`;
                    
                    html += `<li><a class="dropdown-item" href="#" onclick="selectEvent('${ev._id}', '${escapeHtml(eventNameDisplay)}')">${eventNameDisplay}</a></li>`;
                });
                listEl.innerHTML = html;
            } catch (err) {
                listEl.innerHTML = '<li><span class="dropdown-item text-danger text-center py-2">Gagal memuat event</span></li>';
            }
        }
        // Fungsi manual untuk membuka/menutup dropdown
        function toggleDropdown() {
            const list = document.getElementById('customEventList');
            if (list.style.display === 'none' || list.style.display === '') {
                list.style.display = 'block';
            } else {
                list.style.display = 'none';
            }
        }

        // Tutup dropdown otomatis jika pengguna klik di luar area dropdown
        window.addEventListener('click', function(e) {
            const btn = document.getElementById('dropdownEventButton');
            const list = document.getElementById('customEventList');
            if (!btn.contains(e.target) && !list.contains(e.target)) {
                list.style.display = 'none';
            }
        });

        // Modifikasi sedikit fungsi selectEvent agar menu tertutup otomatis setelah dipilih
        function selectEvent(id, name) {
            document.getElementById('selectEventGate').value = id;
            document.getElementById('selectedEventText').innerText = name;
            document.getElementById('customEventList').style.display = 'none'; // Tutup list
        }

        // Mencegah error karakter kutip pada nama event
        function escapeHtml(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // ==========================================
        // 📊 COUNTER SCAN (Tersimpan di Memori HP)
        // ==========================================
        const counterKey = `rcell_vol_scan_count_${user.id}`;
        let totalScanned = parseInt(localStorage.getItem(counterKey)) || 0;
        
        function updateCounterDisplay() {
            document.getElementById('scanCounter').innerText = totalScanned;
        }
        updateCounterDisplay();

        // ==========================================
        // 📷 LOGIKA SCANNER QR CODE
        // ==========================================
        let html5QrcodeScanner = null;
        const startScanWrapper = document.getElementById('startScanWrapper');
        const readerElement = document.getElementById('reader');
        const btnCloseScanner = document.getElementById('btnCloseScanner');
        const scanIndicator = document.getElementById('scanIndicator');
        const beepSound = new Audio('https://www.soundjay.com/buttons/beep-07.wav');

        function startScanner() {
            // Validasi: Pastikan event sudah dipilih sebelum kamera dibuka!
            const selectedEventId = document.getElementById('selectEventGate').value;
            if (!selectedEventId) {
                return Swal.fire({
                    icon: 'warning',
                    title: 'Pilih Event Dulu!',
                    text: 'Panitia wajib memilih event/gate yang sedang dijaga sebelum membuka kamera.',
                    confirmButtonColor: '#f59e0b'
                });
            }

            startScanWrapper.style.display = 'none';
            readerElement.style.display = 'block';
            btnCloseScanner.style.display = 'block';
            scanIndicator.style.display = 'block';

            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
            
            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
            .catch(err => {
                stopScanner();
                Swal.fire('Kamera Gagal', 'Pastikan izin kamera diaktifkan di browser HP Anda!', 'error');
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                }).catch(err => console.log(err));
            }
            readerElement.style.display = 'none';
            btnCloseScanner.style.display = 'none';
            scanIndicator.style.display = 'none';
            startScanWrapper.style.display = 'block';
        }

        async function onScanSuccess(decodedText, decodedResult) {
            if (html5QrcodeScanner) {
                await html5QrcodeScanner.stop();
                html5QrcodeScanner.clear();
            }
            readerElement.style.display = 'none';
            scanIndicator.style.display = 'none';
            btnCloseScanner.style.display = 'none';
            
            beepSound.play(); 

            // Ambil ID event yang dipilih di dropdown
            const selectedEventId = document.getElementById('selectEventGate').value;

            Swal.fire({ title: 'Memvalidasi Tiket...', text: `Kode: ${decodedText}`, allowOutsideClick: false, didOpen: () => Swal.showLoading(), background: '#1e1e1e', color: '#fff' });

            try {
                // KIRIM ticketCode DAN eventId KE BACKEND!
                const res = await fetch('/api/validate', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticketCode: decodedText, eventId: selectedEventId })
                });
                const data = await res.json();

                if (data.valid) {
                    totalScanned += 1;
                    localStorage.setItem(counterKey, totalScanned);
                    updateCounterDisplay();

                    Swal.fire({
                        icon: 'success', title: 'LOLOS!',
                        html: `<h3 class="text-success fw-bold">${decodedText}</h3>
                               <div class="text-start mt-3 p-3" style="background: rgba(16,185,129,0.1); border-radius:10px; border:1px solid #10b981;">
                                   <p class="mb-1"><b>Nama:</b> ${data.data.name}</p>
                                   <p class="mb-0"><b>Event:</b> ${data.data.event}</p>
                               </div>`,
                        confirmButtonText: 'Scan Lagi', confirmButtonColor: '#10b981', background: '#1e1e1e', color: '#fff'
                    }).then(() => { 
                        startScanWrapper.style.display = 'block'; 
                    });

                } else {
                    // Kalau salah event / belum waktunya / tiket palsu, backend otomatis nolak di sini!
                    Swal.fire({
                        icon: 'error', title: data.message || 'DITOLAK',
                        html: `<h4 class="text-danger fw-bold">${decodedText}</h4>
                               <p class="mt-2 text-warning"><b>${data.detail || 'Tiket tidak valid.'}</b></p>`,
                        confirmButtonText: 'Coba Lagi', confirmButtonColor: '#ef4444', background: '#1e1e1e', color: '#fff'
                    }).then(() => { 
                        startScanWrapper.style.display = 'block'; 
                    });
                }
            } catch (err) {
                Swal.fire({icon: 'error', title: 'Sinyal Putus', text: 'Gagal terhubung ke server.'})
                .then(() => { startScanWrapper.style.display = 'block'; });
            }
        }

        function onScanFailure(error) { /* Abaikan error pencarian garis QR */ }

        function logout() {
            localStorage.clear();
            window.location.href = '/user-login';
        }

        document.addEventListener('DOMContentLoaded', () => {
            syncUserProfile(); // 👈 Sinkronkan data dulu sebelum yang lain
            loadEventsForGate();
            updateCounterDisplay();
        });
    </script>
</body>
</html>
